[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "contextmind"
version = "0.3.0"
description = "A Multi-Mode Conversational AI Framework"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [
    { name = "ContextMind Team" },
]
keywords = ["conversational-ai", "dialogue-system", "nlp", "multi-mode"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "google-adk",
    "litellm",
    "openai",
    "python-dotenv",
    "PyYAML>=6.0.0",
    "langextract>=1.1.1",
    "gradio>=4.0.0",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=2.0.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/Jasmine66Bloom/ContextMind"
Documentation = "https://github.com/Jasmine66Bloom/ContextMind/tree/main/docs"
Source = "https://github.com/Jasmine66Bloom/ContextMind"
"Bug Reports" = "https://github.com/Jasmine66Bloom/ContextMind/issues"

[project.scripts]
contextmind-cli = "examples.cli_demo:main"
contextmind-web = "examples.web_demo:main"

[tool.setuptools.packages.find]
exclude = ["tests", "examples", "docs", "resources", "logs"]

[tool.setuptools.package-data]
contextmind = ["config/*.yaml", "modes/fnctod/*.yaml"]
