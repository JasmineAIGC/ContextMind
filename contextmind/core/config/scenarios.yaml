# 场景配置文件
# 定义所有支持的对话场景及其元数据
#
# 配置说明：
# - name: 场景的唯一标识符（小写英文）
# - description: 场景描述
# - aliases: 场景别名列表（支持中文等）
# - app_class: Evolve模式使用的应用类（完整模块路径）
# - schema_getter: FnCTOD模式使用的Schema获取函数（完整模块路径）
#
# 使用方法：
# 1. 添加新场景：在scenarios下添加新的场景配置
# 2. 修改现有场景：直接修改对应的配置项
# 3. 重启应用：修改配置后需要重启应用生效

scenarios:
  # 闲聊场景
  chat:
    name: chat
    description: 通用闲聊场景
    aliases:
      - 闲聊
    app_class: contextmind.scenarios.apps.chat_app.ChatApplication
    schema_getter: contextmind.modes.fnctod.schemas.get_chat_function_schema

  # 客服场景
  callcenter:
    name: callcenter
    description: 客服场景
    aliases:
      - 客服
    app_class: contextmind.scenarios.apps.callcenter_app.CallCenterApplication
    schema_getter: contextmind.modes.fnctod.schemas.get_callcenter_function_schema

  # 保险挽回场景
  insurance:
    name: insurance
    description: 保险挽回场景
    aliases:
      - 保险
      - 保险挽回
    app_class: contextmind.scenarios.apps.insurance_app.InsuranceApplication
    schema_getter: contextmind.modes.fnctod.schemas.get_insurance_function_schema

