# FnCTOD Prompt Templates
# 提示词模板配置文件

# 系统提示词
system_prompt: |
  你是一个具有函数调用能力的任务型对话助手。
  使用提供的函数来追踪对话状态并生成适当的响应。

# 输出格式说明
output_format:
  importance_note: |
    重要要求：你必须始终为每个用户输入输出一个函数调用。
    不要只用自然语言回复 - 你必须包含 <function_call> 标签。
  
  format_description: |
    必需的输出格式 - 你必须严格遵循以下格式：
    
    步骤1：以这个精确格式输出函数调用（函数名需要带引号）：
       <function_call name="function_name">
       {"param1": "value1", "param2": "value2"}
       </function_call>
    
    步骤2：然后，向用户提供自然语言响应

  # 单轮示例模板
  single_turn_example_template: |
    示例（你必须遵循此格式）：
       <function_call name="{domain}">
       {example_params}
       </function_call>
       {example_response}

  # 多轮示例模板
  multi_turn_example_template: |
    多轮示例（始终包含 <function_call> 标签）：
       第1轮 用户：{turn1_user}
       第1轮 助手：
       <function_call name="{domain}">
       {turn1_params}
       </function_call>
       {turn1_response}
       
       第2轮 用户：{turn2_user}
       第2轮 助手：
       <function_call name="{domain}">
       {turn2_params}
       </function_call>
       {turn2_response}

# 累积状态指令
cumulative_state_instructions: |
  每轮对话的关键指令：
  - 你必须在每个响应中包含 <function_call> 标签
  - 包含之前所有轮次的参数，加上任何新的或更新的参数
  - 即使没有提取到新参数，仍然要输出包含现有参数的函数调用
  - 格式：<function_call name="domain_name">{"param": "value"}</function_call>
  - 然后在函数调用标签后添加你的自然语言响应

# 默认示例（如果场景没有定义自定义示例）
default_examples:
  single_turn:
    domain: "chat"
    params: '{"intent_level1": "情感", "emotion": "困惑"}'
    response: "我理解您现在感到困惑。我会尽力帮助您。"
  
  multi_turn:
    domain: "chat"
    turn1:
      user: "我有点不开心"
      params: '{"intent_level1": "情感", "emotion": "烦恼"}'
      response: "我理解您现在不开心。想和我聊聊是什么让您烦恼吗？"
    turn2:
      user: "数学作业太难了"
      params: '{"intent_level1": "求助", "emotion": "烦恼", "topic": "数学"}'
      response: "我明白数学作业很有挑战性。我们一起来看看有什么可以帮到您的。"

# 场景特定示例（可选）
scenario_examples:
  insurance:
    single_turn:
      domain: "insurance"
      params: '{"intent_level1": "咨询", "customer_name": "张三"}'
      response: "好的，张三先生，我理解您想咨询保险产品。请问您对哪方面的保险感兴趣？"
    
    multi_turn:
      domain: "insurance"
      turn1:
        user: "我想了解保险"
        params: '{"intent_level1": "咨询"}'
        response: "好的，我来为您介绍保险产品。请问您贵姓？"
      turn2:
        user: "我姓张"
        params: '{"intent_level1": "咨询", "customer_name": "张先生"}'
        response: "张先生您好，很高兴为您服务。请问您对哪种类型的保险感兴趣？"
  
  callcenter:
    single_turn:
      domain: "callcenter"
      params: '{"intent_level1": "咨询", "issue_type": "产品咨询"}'
      response: "好的，我理解您想咨询产品相关问题。请问具体是哪个产品呢？"
    
    multi_turn:
      domain: "callcenter"
      turn1:
        user: "我的订单有问题"
        params: '{"intent_level1": "投诉", "issue_type": "订单问题"}'
        response: "非常抱歉给您带来不便。请问您的订单号是多少？"
      turn2:
        user: "订单号是12345"
        params: '{"intent_level1": "投诉", "issue_type": "订单问题", "order_number": "12345"}'
        response: "好的，我已经查到您的订单12345。让我为您查看一下具体问题。"
  
  anyihua:
    single_turn:
      domain: "anyihua"
      params: '{"intent_level1": "投诉_借款记录异常", "customer_name": "高先生", "disputed_loan_date": "七月二十三号", "user_emotion": "疑惑"}'
      response: "高先生，我理解您的疑问，关于七月二十三号这笔借款记录，我马上帮您核查一下，请稍等。"
    
    multi_turn:
      domain: "anyihua"
      turn1:
        user: "我没有借过这笔款，为什么有这个记录？"
        params: '{"intent_level1": "投诉_借款记录异常", "issue_description": "用户质疑存在异常借款记录", "user_emotion": "疑惑"}'
        response: "您好，我理解您的疑虑。请问您发现的是哪一天的借款记录呢？"
      turn2:
        user: "七月二十三号那笔一万四千四"
        params: '{"intent_level1": "投诉_借款记录异常", "disputed_loan_date": "七月二十三号", "disputed_loan_amount": "一万四千四", "user_emotion": "疑惑", "resolution_status": "查询中"}'
        response: "明白了，我帮您查询七月二十三号这笔一万四千四百元的借款记录，请您稍等。"
