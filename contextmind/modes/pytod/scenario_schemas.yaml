# PyTOD 内置场景 ServiceSchema
#
# 为 chat / callcenter / insurance 三个内置场景提供预置 ServiceSchema。
# 当用户未通过 build_kb_demo.py 创建知识库时，PyTOD 会自动回退到这些预置 Schema，
# 确保演示脚本（cli_demo / batch_demo / web_demo / pytod_trace_demo）无需知识库也能正常运行。
#
# Schema 结构与 ServiceSchema.from_dict() 兼容：
#   service_name  — 服务名称
#   description   — 场景业务描述
#   slots         — 所有槽位定义（每个 API 参数均作为一个槽位）
#   intents       — 每个注册 API 函数对应一个意图

chat:
  service_name: chat
  description: 日常闲聊与通用助手对话场景，支持天气查询、信息搜索、翻译、计算、新闻、菜谱推荐等功能
  slots:
    - name: city
      description: 城市名称
    - name: date
      description: 日期（今天/明天/后天等）
    - name: query
      description: 搜索关键词或问题
    - name: category
      description: 分类（新闻类别、搜索类别等）
    - name: topic
      description: 话题或主题（如笑话话题）
    - name: text
      description: 待翻译的文本内容
    - name: target_language
      description: 翻译目标语言（中文/英文/日文/韩文等）
    - name: source_language
      description: 翻译源语言（可选，不指定则自动检测）
    - name: expression
      description: 数学表达式（如 100*0.85 或 1200/12）
    - name: timezone
      description: 时区（如 Asia/Shanghai、America/New_York）
    - name: value
      description: 待换算的数值
    - name: from_unit
      description: 原始单位（米/英尺/千克/磅/摄氏度/华氏度等）
    - name: to_unit
      description: 目标单位
    - name: content_type
      description: 内容类型（电影/音乐/书籍/播客）
    - name: genre
      description: 风格或类型
    - name: mood
      description: 当前心情
    - name: count
      description: 返回数量
    - name: dish_name
      description: 菜品名称
    - name: dietary_restrictions
      description: 饮食限制（素食/低糖/低脂等）
    - name: servings
      description: 份量（人数）
  intents:
    - name: get_weather
      description: 查询天气预报，支持今天/明天/后天或指定城市
      optional_slots: [city, date]
    - name: search_info
      description: 搜索信息或回答知识类问题
      optional_slots: [query, category]
    - name: tell_joke
      description: 讲一个笑话，支持程序员/数学/生活/动物等主题
      optional_slots: [topic]
    - name: translate_text
      description: 翻译文本到指定目标语言
      optional_slots: [text, target_language, source_language]
    - name: calculate
      description: 计算数学表达式，支持加减乘除、百分比等基础运算
      optional_slots: [expression]
    - name: get_current_time
      description: 查询当前时间，支持按城市或时区查询
      optional_slots: [city, timezone]
    - name: convert_units
      description: 单位换算，支持长度、重量、温度等
      optional_slots: [value, from_unit, to_unit]
    - name: recommend_content
      description: 推荐内容（电影、音乐、书籍、播客）
      optional_slots: [content_type, genre, mood]
    - name: get_news_headlines
      description: 获取新闻头条，支持科技/财经/体育/娱乐/社会/国际等分类
      optional_slots: [category, count]
    - name: get_recipe
      description: 获取菜谱，支持指定饮食限制和份量
      optional_slots: [dish_name, dietary_restrictions, servings]

callcenter:
  service_name: callcenter
  description: 电商客服对话场景，支持订单查询、投诉处理、退款申请、物流查询、积分查询等功能
  slots:
    - name: order_id
      description: 订单号
    - name: customer_id
      description: 客户ID
    - name: product_name
      description: 商品名称
    - name: purchase_date
      description: 购买日期
    - name: complaint_type
      description: 投诉类型（服务投诉/产品质量/物流问题/退款纠纷等）
    - name: description
      description: 问题详细描述
    - name: urgency
      description: 紧急程度（普通/高/紧急）
    - name: reason
      description: 退款原因
    - name: amount
      description: 退款金额
    - name: refund_id
      description: 退款单号
    - name: tracking_number
      description: 快递单号
    - name: department
      description: 转接目标部门
    - name: issue_type
      description: 问题类型（用于转接人工客服时标注问题分类）
    - name: priority
      description: 优先级（普通/高/紧急）
    - name: account_type
      description: 账户类型（普通账户/会员账户/企业账户）
    - name: coupon_code
      description: 优惠券码或折扣码
    - name: new_address
      description: 新的收货地址
    - name: recipient_name
      description: 收货人姓名
    - name: phone
      description: 电话号码
    - name: preferred_time
      description: 期望回电时间
    - name: issue_description
      description: 预约回电时的问题描述
    - name: product_id
      description: 商品ID
    - name: attribute
      description: 查询的商品属性（规格/库存/评价/价格）
  intents:
    - name: lookup_order
      description: 查询订单信息，支持按订单号、客户ID、商品名称或购买日期查询
      optional_slots: [order_id, customer_id, product_name, purchase_date]
    - name: submit_complaint
      description: 提交投诉或反馈，适用于服务不满意、产品问题、物流问题等场景
      optional_slots: [complaint_type, description, order_id, urgency]
    - name: process_refund
      description: 申请退款，需要提供订单号（或商品名称）及退款原因
      optional_slots: [order_id, reason, amount, product_name]
    - name: check_refund_status
      description: 查询退款进度，支持按退款单号或原订单号查询
      optional_slots: [refund_id, order_id]
    - name: check_logistics
      description: 查询物流轨迹，按订单号或快递单号查询实时物流状态
      optional_slots: [order_id, tracking_number]
    - name: transfer_to_agent
      description: 转接人工客服，复杂问题或客户强烈要求时使用
      optional_slots: [department, issue_type, priority]
    - name: check_account_status
      description: 查询账户状态与余额
      optional_slots: [customer_id, account_type]
    - name: query_points_balance
      description: 查询积分余额及可兑换商品/优惠券列表
      optional_slots: [customer_id]
    - name: apply_discount_coupon
      description: 为订单应用优惠券或折扣码
      optional_slots: [order_id, coupon_code, customer_id]
    - name: update_delivery_address
      description: 修改订单配送地址（仅限未发货订单）
      optional_slots: [order_id, new_address, recipient_name, phone]
    - name: schedule_callback
      description: 预约客服回拨，在客户无法等待时安排客服在指定时间主动联系
      optional_slots: [customer_id, preferred_time, issue_description, phone]
    - name: query_product_info
      description: 查询商品详情、规格、库存及评价
      optional_slots: [product_name, product_id, attribute]

insurance:
  service_name: insurance
  description: 保险咨询与服务场景，支持险种查询、保费计算、产品对比、理赔申请、保单管理等功能
  slots:
    - name: insurance_type
      description: 保险类型（癌症险/重疾险/寿险/医疗险/意外险）
    - name: customer_age
      description: 客户年龄
    - name: coverage_type
      description: 保障类型（身故保障/重疾保障/医疗报销等）
    - name: coverage_amount
      description: 保额（元）
    - name: gender
      description: 性别（男/女）
    - name: product_a
      description: 对比产品A的名称
    - name: product_b
      description: 对比产品B的名称
    - name: condition
      description: 健康状况或既往病史
    - name: policy_number
      description: 保单号
    - name: customer_name
      description: 客户姓名
    - name: claim_type
      description: 理赔类型（重疾理赔/医疗报销/意外理赔等）
    - name: incident_date
      description: 事故或诊断日期
    - name: description
      description: 理赔情况描述
    - name: claim_id
      description: 理赔单号
    - name: age
      description: 年龄（用于推荐场景）
    - name: budget
      description: 保费预算（元/月或元/年）
    - name: needs
      description: 保障需求（如重疾保障/医疗报销/子女教育金等）
    - name: city
      description: 城市名称（用于查询医院网络）
    - name: hospital_name
      description: 医院名称
    - name: action
      description: 操作类型（suspend=暂停 / resume=恢复）
  intents:
    - name: query_insurance
      description: 查询保险产品信息，支持按险种、年龄、保障类型筛选
      optional_slots: [insurance_type, customer_age, coverage_type]
    - name: calculate_premium
      description: 精算保费，根据险种、年龄、保额及性别计算月保费和年保费
      optional_slots: [insurance_type, customer_age, coverage_amount, gender]
    - name: compare_products
      description: 对比两款保险产品的保障范围和性价比
      optional_slots: [product_a, product_b, customer_age]
    - name: check_health_requirements
      description: 查询投保健康告知要求，判断某种健康状况是否影响投保
      optional_slots: [insurance_type, condition]
    - name: get_policy_details
      description: 查询保单详情，需要保单号或客户姓名
      optional_slots: [policy_number, customer_name]
    - name: submit_claim
      description: 提交理赔申请，需要保单号、理赔类型和事故/诊断日期
      optional_slots: [policy_number, claim_type, incident_date, description]
    - name: check_claim_status
      description: 查询理赔进度，支持按理赔单号或保单号查询
      optional_slots: [claim_id, policy_number]
    - name: recommend_insurance
      description: 个性化保险推荐，根据年龄、性别、预算和保障需求推荐合适险种
      optional_slots: [age, gender, budget, needs]
    - name: query_renewal_options
      description: 查询保单续保方案与到期提醒
      optional_slots: [policy_number]
    - name: lookup_hospital
      description: 查询医院是否在保险直付或定点网络中
      optional_slots: [city, hospital_name, insurance_type]
    - name: suspend_or_resume_policy
      description: 暂停或恢复保单（部分险种支持）
      optional_slots: [policy_number, action]
