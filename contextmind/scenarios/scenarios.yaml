# 场景配置文件 — 定义所有支持的对话场景及其元数据
#
# 使用方法：
#   - 添加新场景：在 scenarios 下新增条目，重启后生效
#   - app_class:    Evolve 模式使用的应用类
#
# FnCTOD 和 PyTOD 的 schema 数据均通过外部文件传入（data/*_fnctod_domain.json 或
# data/*_schema.json），不再在此配置 schema_getter。
# 请使用 --schema 参数指定 schema 文件路径。

scenarios:
  chat:
    description: 通用闲聊场景
    aliases: [闲聊]
    app_class: contextmind.scenarios.app.EvolveApplication

  callcenter:
    description: 客服场景
    aliases: [客服]
    app_class: contextmind.scenarios.app.EvolveApplication

  insurance:
    description: 保险销售场景
    aliases: [保险, 保险销售]
    app_class: contextmind.scenarios.app.EvolveApplication

  anyihua:
    description: 安逸花外呼场景
    aliases: [安逸花, 安逸花外呼, anyihua_outbound]
    app_class: contextmind.scenarios.app.EvolveApplication
